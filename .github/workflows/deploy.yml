name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate site files
        run: |
          set -euo pipefail
          test -f index.html
          # every file referenced from index.html (src/href, local paths only) must exist
          missing=0
          for ref in $(grep -oE '(src|href)="[^"#:]+"' index.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u); do
            if [ ! -f "$ref" ]; then echo "::error::Missing file referenced in index.html: $ref"; missing=1; fi
          done
          # all 9 avatar directions must be present
          for d in up-left up up-right left center right down-left down down-right; do
            ls assets/avatar/$d.* >/dev/null 2>&1 || { echo "::error::Missing avatar image: $d"; missing=1; }
          done
          exit $missing

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r index.html assets .nojekyll _site/
          [ -f resume.pdf ] && cp resume.pdf _site/ || true
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/; s/__BUILD_DATE__/$(date -u +%Y-%m-%d)/" _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
